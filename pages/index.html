<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人格升华管理台</title>
  <style>
    :root{--bg:#f7efe1;--panel:#fffaf0;--ink:#2b2118;--muted:#7b6a59;--line:#dcc7a3;--accent:#9b5c25;--ok:#26804a;--danger:#b42318;--shadow:0 10px 26px #5b3b161a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:20;background:#21170f;color:#ffe9bf;border-bottom:4px solid var(--accent);box-shadow:0 8px 28px #0004}.top{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:14px 20px}.brand{font-size:22px;font-weight:900;letter-spacing:.04em}.warn{font-size:12px;color:#ffcf8a}.wrap{padding:18px;display:grid;grid-template-columns:330px 1fr;gap:16px}.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.card h2,.card h3{margin:0;padding:12px 14px;background:#2a2118;color:#ffe9bf;font-size:15px;letter-spacing:.03em}.body{padding:14px}.stack{display:grid;gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:2px solid #2a2118;background:#fff7e8;color:#2a2118;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}input,select,textarea,button{font:inherit;border:2px solid #2a211833;border-radius:12px;padding:9px 10px;background:#fffdf8;color:var(--ink)}textarea{width:100%;min-height:92px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}select,input{width:100%}button{cursor:pointer;font-weight:900;background:#2a2118;color:#fff;border-color:#2a2118}button.secondary{background:#fff7e8;color:#2a2118}button.good{background:var(--ok);border-color:var(--ok)}button.danger{background:var(--danger);border-color:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}.mini{font-size:12px;color:var(--muted)}.pill{display:inline-block;border-radius:999px;background:#ead7b4;padding:3px 8px;font-size:12px;font-weight:800;margin:2px}.status-pending{background:#ffdf90}.status-approved{background:#b8e5c9}.status-applied{background:#c8d8f2}.list{display:grid;gap:8px;max-height:52vh;overflow:auto;padding-right:4px}.item{background:#fffdf8;border:2px solid #2a211820;border-radius:14px;padding:10px;cursor:pointer}.item:hover{border-color:var(--accent);box-shadow:0 4px 12px #5b3b1620}.item-title{font-weight:900}.item-meta{font-size:12px;color:var(--muted);margin:4px 0}.mutedbox{background:#fff7e8;border:1px dashed var(--line);border-radius:12px;padding:10px}.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi>div{background:#fff7e8;border-radius:12px;padding:10px;text-align:center}.section{display:none}.section.active{display:block}.split{display:grid;grid-template-columns:420px 1fr;gap:14px}.diff,pre{background:#201810;color:#fff3d6;border-radius:12px;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;max-height:52vh}.capture-layout{display:grid;grid-template-columns:390px 1fr;gap:12px}.toast{position:fixed;right:18px;bottom:18px;background:#21170f;color:#ffe9bf;padding:12px 14px;border-radius:14px;box-shadow:var(--shadow);z-index:50}.hidden{display:none}.dangerText{color:var(--danger)}@media(max-width:1000px){.wrap,.split,.grid2,.capture-layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="top"><div><div class="brand">人格升华管理台</div><div class="warn">无内置鉴权：只在可信网络使用。所有修改必须由人类按钮触发。</div></div><div class="row"><button class="secondary" onclick="reloadAll()">全部刷新</button></div></div></header>
<div class="wrap">
  <aside class="card">
    <h2>人格控制</h2>
    <div class="body stack">
      <label><span class="mini">人格 ID</span><select id="personaSelect"></select></label>
      <div id="personaCard" class="mutedbox mini">加载中...</div>
      <div class="kpi"><div><b id="kObs">0</b><br><span class="mini">观察</span></div><div><b id="kPatch">0</b><br><span class="mini">补丁</span></div><div><b id="kLen">0</b><br><span class="mini">提示词字数</span></div></div>
      <button onclick="createCurrentSnapshot()">创建当前人格快照</button>
      <button class="secondary" onclick="loadPersonaDetail()">刷新人格提示词</button>
    </div>
  </aside>
  <main class="card">
    <div class="body">
      <nav class="tabs">
        <button class="tab active" data-tab="observations" onclick="switchTab('observations')">观察记录</button>
        <button class="tab" data-tab="patches" onclick="switchTab('patches')">人格补丁</button>
        <button class="tab" data-tab="snapshots" onclick="switchTab('snapshots')">人格快照</button>
        <button class="tab" data-tab="templates" onclick="switchTab('templates')">模板 / 模块</button>
        <button class="tab" data-tab="captures" onclick="switchTab('captures')">请求捕获</button>
      </nav>
      <section id="tab-observations" class="section active"><div class="split"><div class="stack"><h3>新增观察</h3><input id="obsSource" placeholder="来源：主人反馈 / 会话 / 捕获记录" /><textarea id="obsContent" placeholder="内容（必填）"></textarea><textarea id="obsInterpretation" placeholder="理解 / 解读"></textarea><input id="obsEmotion" placeholder="情绪标记" /><button onclick="createObservation()">新增观察</button></div><div><h3>观察记录</h3><div id="observationsList" class="list"></div></div></div></section>
      <section id="tab-patches" class="section"><div class="split"><div class="stack"><h3>创建 / 编辑补丁草案</h3><input id="patchIdEditing" placeholder="正在编辑的补丁 ID（空=新建）" readonly /><input id="patchTrigger" placeholder="触发原因" /><textarea id="patchChanges" placeholder='调整项 JSON 或备注，例如 [{"aspect":"语气","after":"更短"}]'></textarea><textarea id="patchBase" placeholder="基线提示词（默认当前人格提示词）"></textarea><textarea id="patchProposed" placeholder="拟议提示词（可手动编辑；不填则只保存结构化草案）"></textarea><div class="row"><button onclick="createOrUpdatePatch()">保存补丁草案</button><button class="secondary" onclick="resetPatchEditor()">新草案</button></div></div><div class="stack"><h3>人格补丁</h3><div id="patchesList" class="list"></div><h3>补丁详情</h3><div id="patchDetail" class="mutedbox mini">选择补丁查看差异。</div><div class="row"><button class="good" onclick="approveSelectedPatch()">审批</button><button class="danger" onclick="applySelectedPatch()">应用</button><button class="danger" onclick="approveAndApplySelectedPatch()">直接审批并应用</button></div><pre id="patchDiff" class="diff">这里会显示差异</pre></div></div></section>
      <section id="tab-snapshots" class="section"><div class="grid2"><div><h3>快照 / 基线</h3><div id="snapshotsList" class="list"></div></div><div><h3>快照内容</h3><pre id="snapshotContent">点击快照查看内容</pre></div></div></section>
      <section id="tab-templates" class="section"><div class="grid2"><div><h3>模板 / 模块</h3><div id="templatesList" class="list"></div></div><div><h3>内容（点击后查看）</h3><div class="mini dangerText">敏感模块不会自动展开。</div><pre id="templateContent">点击模板/模块后查看内容</pre></div></div></section>
      <section id="tab-captures" class="section"><div class="capture-layout"><div><div class="row"><input id="sessionFilter" list="sessions" placeholder="按 session_id 过滤"/><datalist id="sessions"></datalist><button onclick="loadCaptures()">刷新</button></div><div id="capturesList" class="list"></div></div><div><pre id="captureDetail">点击捕获记录查看详情</pre></div></div></section>
    </div>
  </main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const apiBase='./api'; const $=id=>document.getElementById(id);
let state={personas:[], personaId:'', persona:null, selectedPatch:null, activeTab:'observations'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function statusText(s){return {pending:'待审批',approved:'已审批',applied:'已应用'}[s]||s||'-';}
function preview(s,n=140){s=String(s??'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'…':s;}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3200)}
async function api(path,opt={}){const r=await fetch(apiBase+path,{headers:{'Content-Type':'application/json'},...opt});const data=await r.json().catch(()=>({ok:false,error:'响应格式错误'}));if(!data.ok) throw new Error(data.error||`HTTP ${r.status}`);return data;}
function selectedPersona(){return $('personaSelect').value||state.personaId;}
function switchTab(tab){state.activeTab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));$('tab-'+tab).classList.add('active');}
async function reloadAll(){await loadPersonas(); await loadPersonaScoped(); await loadTemplates(); await loadCaptures();}
async function loadPersonas(){const data=await api('/personas');state.personas=data.items||[];$('personaSelect').innerHTML=state.personas.map(p=>`<option value="${esc(p.persona_id)}">${esc(p.persona_id)}</option>`).join(''); if(!state.personaId && state.personas[0]) state.personaId=state.personas[0].persona_id; $('personaSelect').value=state.personaId; await loadPersonaDetail();}
async function loadPersonaDetail(){const pid=selectedPersona(); if(!pid)return; state.personaId=pid; const card=state.personas.find(p=>p.persona_id===pid)||{}; $('kObs').textContent=card.observation_count||0; $('kPatch').textContent=card.patch_count||0; $('kLen').textContent=card.system_prompt_len||0; const d=await api('/personas/'+encodeURIComponent(pid)); state.persona=d.item; $('personaCard').innerHTML=`<b>${esc(pid)}</b><br>提示词 ${esc((d.item.system_prompt||'').length)} 字<br><span class="mini">工具 ${esc((d.item.tools||[]).length)} · 技能 ${esc((d.item.skills||[]).length)}</span>`; if(!$('patchBase').value) $('patchBase').value=d.item.system_prompt||'';}
$('personaSelect').addEventListener('change',async()=>{state.personaId=selectedPersona(); resetPatchEditor(); await loadPersonaDetail(); await loadPersonaScoped();});
async function loadPersonaScoped(){await Promise.all([loadObservations(),loadPatches(),loadSnapshots()]);}
async function loadObservations(){const pid=selectedPersona(); const data=await api('/observations?persona_id='+encodeURIComponent(pid)+'&limit=120'); $('observationsList').innerHTML=(data.items||[]).map(o=>`<div class="item"><div class="item-title">${esc(o.source||'观察记录')}</div><div class="item-meta">${esc(o.timestamp_iso)} · ${esc(o.emotion||'')}</div><div>${esc(preview(o.content,220))}</div></div>`).join('')||'<div class="mutedbox">暂无观察记录</div>';}
async function createObservation(){const pid=selectedPersona(); const body={persona_id:pid,source:$('obsSource').value,content:$('obsContent').value,interpretation:$('obsInterpretation').value,emotion:$('obsEmotion').value}; await api('/observations',{method:'POST',body:JSON.stringify(body)}); ['obsSource','obsContent','obsInterpretation','obsEmotion'].forEach(id=>$(id).value=''); toast('观察已创建'); await loadObservations(); await loadPersonas();}
function parseChanges(){const raw=$('patchChanges').value.trim(); if(!raw)return []; try{return JSON.parse(raw)}catch{return [{aspect:'备注',after:raw,reason:'人工草案备注'}]}}
function resetPatchEditor(){state.selectedPatch=null; $('patchIdEditing').value=''; $('patchTrigger').value=''; $('patchChanges').value=''; $('patchBase').value=state.persona?.system_prompt||''; $('patchProposed').value=''; $('patchDetail').textContent='选择补丁查看差异。'; $('patchDiff').textContent='这里会显示差异';}
async function createOrUpdatePatch(){const pid=selectedPersona(); const patchId=$('patchIdEditing').value.trim(); const proposed=$('patchProposed').value; const body={persona_id:pid,trigger:$('patchTrigger').value,changes:parseChanges(),base_prompt:$('patchBase').value,proposed_prompt:proposed,notes:$('patchChanges').value}; if(patchId){const data=await api('/patches/'+encodeURIComponent(patchId),{method:'PATCH',body:JSON.stringify(body)}); toast('补丁草案已更新'); selectPatch(data.item);} else {const data=await api('/patches',{method:'POST',body:JSON.stringify(body)}); toast('补丁草案已创建'); await loadPatches(); await selectPatchById(data.patch_id);} await loadPatches();}
async function loadPatches(){const pid=selectedPersona(); const data=await api('/patches?persona_id='+encodeURIComponent(pid)+'&limit=120'); $('patchesList').innerHTML=(data.items||[]).map(p=>`<div class="item" onclick="selectPatchById('${esc(p.patch_id)}')"><div class="item-title">${esc(p.patch_id)} <span class="pill status-${esc(p.status)}">${esc(statusText(p.status))}</span></div><div class="item-meta">${esc(p.timestamp_iso)} · ${esc(p.trigger||'无触发原因')}</div><div>${esc(preview((p.changes||[]).map?.(x=>x.after||x.aspect||JSON.stringify(x)).join(' / ')||'',160))}</div></div>`).join('')||'<div class="mutedbox">暂无补丁</div>';}
async function selectPatchById(id){const data=await api('/patches/'+encodeURIComponent(id)); selectPatch(data.item)}
function selectPatch(p){state.selectedPatch=p; $('patchIdEditing').value=p.patch_id; $('patchTrigger').value=p.trigger||''; $('patchChanges').value=JSON.stringify(p.changes||[],null,2); $('patchBase').value=p.base_prompt||''; $('patchProposed').value=p.proposed_prompt||''; $('patchDetail').innerHTML=`<b>${esc(p.patch_id)}</b> <span class="pill status-${esc(p.status)}">${esc(statusText(p.status))}</span><br>人格：${esc(p.persona_id)}<br>审批人：${esc(p.approved_by||'-')}<br>应用时间：${esc(p.applied_at||'-')}`; $('patchDiff').textContent=p.diff||'（无差异）';}
async function approveSelectedPatch(){if(!state.selectedPatch)return toast('请先选择一个补丁'); await api('/patches/'+encodeURIComponent(state.selectedPatch.patch_id)+'/approve',{method:'POST',body:JSON.stringify({approved_by:'前端人工审批'})}); toast('补丁已审批'); await loadPatches(); await selectPatchById(state.selectedPatch.patch_id);}
async function applySelectedPatch(){if(!state.selectedPatch)return toast('请先选择一个补丁'); if(!confirm(`确定把已审批补丁 ${state.selectedPatch.patch_id} 应用到人格 ${state.selectedPatch.persona_id} 吗？`))return; await api('/patches/'+encodeURIComponent(state.selectedPatch.patch_id)+'/apply',{method:'POST',body:JSON.stringify({})}); toast('补丁已应用'); await loadPatches(); await loadPersonas(); await selectPatchById(state.selectedPatch.patch_id);}
async function approveAndApplySelectedPatch(){if(!state.selectedPatch)return toast('请先选择一个补丁'); if(!confirm(`确定直接审批并应用补丁 ${state.selectedPatch.patch_id} 到人格 ${state.selectedPatch.persona_id} 吗？仍会执行基线提示词安全检查。`))return; await api('/patches/'+encodeURIComponent(state.selectedPatch.patch_id)+'/apply',{method:'POST',body:JSON.stringify({auto_approve:true,approved_by:'前端人工直接审批'})}); toast('补丁已直接审批并应用'); await loadPatches(); await loadPersonas(); await selectPatchById(state.selectedPatch.patch_id);}
async function loadSnapshots(){const pid=selectedPersona(); const data=await api('/snapshots?persona_id='+encodeURIComponent(pid)+'&limit=80'); $('snapshotsList').innerHTML=(data.items||[]).map(s=>`<div class="item" onclick="viewSnapshot('${esc(s.snapshot_id)}')"><div class="item-title">${esc(s.label||s.snapshot_id)}</div><div class="item-meta">${esc(s.timestamp_iso)} · ${esc(s.source)} · ${esc(s.content_len)} 字</div></div>`).join('')||'<div class="mutedbox">暂无快照</div>';}
async function createCurrentSnapshot(){const pid=selectedPersona(); const data=await api('/snapshots',{method:'POST',body:JSON.stringify({persona_id:pid,label:`手动创建的当前快照：${pid}`})}); toast('快照已创建：'+data.snapshot_id); await loadSnapshots();}
async function viewSnapshot(id){const data=await api('/snapshots/'+encodeURIComponent(id)); $('snapshotContent').textContent=data.item.content||'';}
async function loadTemplates(){const data=await api('/templates'); $('templatesList').innerHTML=(data.items||[]).map(t=>`<div class="item" onclick="viewTemplate('${esc(t.template_id)}')"><div class="item-title">${esc(t.name||t.template_id)}</div><div class="item-meta">${esc(t.template_id)} · ${esc(t.metadata?.kind||'模板')} · ${esc((t.content||'').length)} 字</div><div>${esc(t.description||'')}</div></div>`).join('')||'<div class="mutedbox">暂无模板</div>';}
async function viewTemplate(id){if(!confirm('确定展开模板/模块内容吗？里面可能包含敏感提示词材料。'))return; const data=await api('/templates/'+encodeURIComponent(id)); $('templateContent').textContent=data.item.content||'';}
async function loadCaptures(){const sess=$('sessionFilter').value.trim(); const data=await api('/captures?limit=80'+(sess?'&session_id='+encodeURIComponent(sess):'')); $('capturesList').innerHTML=(data.items||[]).map(c=>`<div class="item" onclick="viewCapture(${c.id})"><div class="item-title">#${c.id} ${esc(c.persona_id||'')}</div><div class="item-meta">${esc(c.timestamp_iso)} · ${esc(c.session_id||'')}</div><div>${esc(preview(c.prompt,150))}</div></div>`).join('')||'<div class="mutedbox">暂无捕获记录</div>'; const s=await api('/sessions'); $('sessions').innerHTML=(s.items||[]).map(x=>`<option value="${esc(x.session_id)}">${esc(x.count)} · ${esc(x.last_timestamp_iso)}</option>`).join('');}
async function viewCapture(id){const data=await api('/captures/'+id); $('captureDetail').textContent=JSON.stringify(data.item,null,2);}
reloadAll().catch(e=>toast(e.message));
</script>
</body>
</html>
